<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Total Belanja dan Diskon</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 2rem; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    label { display: block; margin-top: 1rem; }
    input { width: 100%; padding: 0.5rem; margin-top: 0.3rem; border: 1px solid #ccc; border-radius: 0.5rem; }
    button { margin-top: 1.5rem; background: #1d4ed8; color: white; border: none; padding: 0.8rem; border-radius: 0.5rem; width: 100%; font-weight: bold; cursor: pointer; }
    #hasil { margin-top: 1.5rem; padding: 1rem; background: #eef4ff; border-radius: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kalkulator Total Belanja</h1>
    <form id="formBelanja">
      <label for="namaBarang">Nama Barang</label>
      <input id="namaBarang" type="text" value="Buku" required>
      <label for="harga">Harga Satuan</label>
      <input id="harga" type="number" min="0" value="50000" required>
      <label for="jumlah">Jumlah</label>
      <input id="jumlah" type="number" min="1" value="3" required>
      <button type="submit">Hitung</button>
    </form>
    <div id="hasil"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
